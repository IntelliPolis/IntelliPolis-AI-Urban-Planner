<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <style>
      text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;fill:#18332e}.title{font-size:34px;font-weight:800}.sub{font-size:15px;fill:#66736f}.head{font-size:15px;font-weight:800}.msg{font-size:14px}.note{font-size:12px;fill:#66736f}.life{stroke:#9aa9a4;stroke-width:2;stroke-dasharray:7 6}.call{stroke:#2b7565;stroke-width:2.2;fill:none}.return{stroke:#a78534;stroke-width:2;stroke-dasharray:7 5;fill:none}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#2b7565"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#a78534"/></marker>
  </defs>
  <rect width="1600" height="1120" fill="#f5f2e9"/>
  <text x="65" y="62" class="title">도시 분석 시퀀스 다이어그램</text>
  <text x="65" y="90" class="sub">지역 선택 → 데이터 결합 → 계획 생성 → MapLibre 비교 표시</text>

  <g text-anchor="middle" class="head">
    <g transform="translate(80 125)"><rect width="170" height="58" rx="12" fill="#fff" stroke="#173f37" stroke-width="2"/><text x="85" y="36">사용자</text></g>
    <g transform="translate(330 125)"><rect width="190" height="58" rx="12" fill="#fff" stroke="#173f37" stroke-width="2"/><text x="95" y="36">React · MapLibre</text></g>
    <g transform="translate(620 125)"><rect width="190" height="58" rx="12" fill="#edf5f1" stroke="#2b7565" stroke-width="2"/><text x="95" y="36">Spring Boot API</text></g>
    <g transform="translate(900 125)"><rect width="190" height="58" rx="12" fill="#fff7dc" stroke="#a78534" stroke-width="2"/><text x="95" y="36">공간·통계 서비스</text></g>
    <g transform="translate(1180 125)"><rect width="160" height="58" rx="12" fill="#173f37"/><text x="80" y="36" fill="#fff">외부 API</text></g>
    <g transform="translate(1400 125)"><rect width="150" height="58" rx="12" fill="#d9b85e"/><text x="75" y="36">Gemini</text></g>
  </g>
  <g class="life"><line x1="165" y1="183" x2="165" y2="1060"/><line x1="425" y1="183" x2="425" y2="1060"/><line x1="715" y1="183" x2="715" y2="1060"/><line x1="995" y1="183" x2="995" y2="1060"/><line x1="1260" y1="183" x2="1260" y2="1060"/><line x1="1475" y1="183" x2="1475" y2="1060"/></g>

  <g class="msg">
    <text x="285" y="228" text-anchor="middle">1. 시·구 선택 후 분석 시작</text><path d="M165 238H415" class="call" marker-end="url(#a)"/>
    <text x="570" y="278" text-anchor="middle">2. 구 통계·구 경계 요청</text><path d="M425 288H705" class="call" marker-end="url(#a)"/>
    <text x="850" y="328" text-anchor="middle">3. CSV 집계 및 PNU 필지 병합</text><path d="M715 338H985" class="call" marker-end="url(#a)"/>
    <rect x="865" y="356" width="260" height="64" rx="10" fill="#fff7dc" stroke="#d9b85e"/><text x="995" y="383" text-anchor="middle" class="note">연속지적도 + 법정동코드</text><text x="995" y="404" text-anchor="middle" class="note">구 경계 Polygon 생성·캐시</text>
    <text x="850" y="455" text-anchor="middle">4. 구 현황·경계 반환</text><path d="M985 465H725" class="return" marker-end="url(#r)"/>
    <text x="988" y="510" text-anchor="middle">5. VWorld 좌표·ITS 속도 조회</text><path d="M715 520H1250" class="call" marker-end="url(#a)"/>
    <rect x="1135" y="538" width="250" height="57" rx="10" fill="#edf5f1" stroke="#2b7565"/><text x="1260" y="563" text-anchor="middle" class="note">지역검색 실패 시</text><text x="1260" y="583" text-anchor="middle" class="note">구 경계 중심좌표로 fallback</text>
    <text x="850" y="630" text-anchor="middle">6. 개발 후보 공간분석</text><path d="M715 640H985" class="call" marker-end="url(#a)"/>
    <rect x="845" y="658" width="300" height="78" rx="10" fill="#fff7dc" stroke="#d9b85e"/><text x="995" y="684" text-anchor="middle" class="note">500㎡ 이상 필지</text><text x="995" y="705" text-anchor="middle" class="note">계획시설 비충돌 + 도시지역 내부</text><text x="995" y="726" text-anchor="middle" class="note">상위 후보 20개 반환</text>
    <text x="1100" y="774" text-anchor="middle">7. 도시 분석·계획안 생성 요청</text><path d="M715 784H1465" class="call" marker-end="url(#a)"/>
    <text x="1090" y="824" text-anchor="middle">8. 분야별 해석·계획 설명</text><path d="M1465 834H725" class="return" marker-end="url(#r)"/>
    <rect x="650" y="852" width="410" height="64" rx="10" fill="#edf5f1" stroke="#2b7565"/><text x="855" y="879" text-anchor="middle" class="note">Java가 점수와 객관 수치를 계산</text><text x="855" y="900" text-anchor="middle" class="note">Gemini 실패 시 규칙 기반 fallback</text>
    <text x="570" y="950" text-anchor="middle">9. 통합 분석 결과 반환</text><path d="M705 960H435" class="return" marker-end="url(#r)"/>
    <text x="295" y="1000" text-anchor="middle">10. 구 경계·시설명·계획 비교 표시</text><path d="M415 1010H175" class="return" marker-end="url(#r)"/>
  </g>
  <text x="800" y="1085" text-anchor="middle" class="note">현재 최초 구 경계 생성은 필지 병합 때문에 오래 걸릴 수 있으며, 동일 프로세스에서는 메모리 캐시를 사용한다.</text>
</svg>
